services:
  - type: web
    name: kala-samskruthi-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kala-samskruthi-db
          property: connectionString
      - key: PORT
        value: 5000

databases:
  - name: kala-samskruthi-db
    plan: free
    postgresMajorVersion: 15
